name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate before publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run deterministic contract tests with enforced coverage
        run: npm run test:coverage

      # Random file and test order catches leaked state; the log prints the
      # seed, and `npm run test:unit:shuffle -- --sequence.seed=<seed>` replays it.
      - name: Run deterministic contract tests in shuffled order
        run: npm run test:unit:shuffle

      - name: Packed install smoke
        run: npm run test:pack-smoke

  muse-loopback:
    name: Muse ${{ matrix.muse.version }} loopback integration
    # Muse 1.1.1's bwrap cannot create its loopback namespace under Ubuntu
    # 24.04's default AppArmor policy. Keep sandboxed execution enabled on 22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Public artifacts with SHA-256 from Meta's release manifests
        # (lookaside .../download/?channel=muse&version=<version>&file=manifest.json).
        muse:
          # Supported baseline: capability-gated suites skip.
          - version: 1.1.1-R2514.1
            sha256: 47908f2e5b0ac5b0c0ba147a48b30a9e48c0aebea3c5cc891ad34d95425a4993
            require-host-features: ""
          # Newest verified host: every capability-gated suite must run.
          - version: 1.4.7-R6101.1
            sha256: 36e3dac91f56c15572b95be55d70ee9fd9685cd9ab49f747bab4746c8d7c2518
            require-host-features: all

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install verified Muse Code CLI
        env:
          MUSE_VERSION: ${{ matrix.muse.version }}
          MUSE_SHA256: ${{ matrix.muse.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/muse-code"
          curl --fail --location --silent --show-error --retry 3 \
            "https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version=$MUSE_VERSION&file=muse-x86-linux" \
            --output "$RUNNER_TEMP/muse-code/muse"
          echo "$MUSE_SHA256  $RUNNER_TEMP/muse-code/muse" | sha256sum --check
          chmod +x "$RUNNER_TEMP/muse-code/muse"
          echo "$RUNNER_TEMP/muse-code" >> "$GITHUB_PATH"
          echo "MUSE_CODE_EXECUTABLE=$RUNNER_TEMP/muse-code/muse" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/muse-code/muse" --version
          "$RUNNER_TEMP/muse-code/muse" serve --help >/dev/null

      - name: Run required real-host loopback suites
        run: npm run test:muse-loopback
        env:
          MUSE_CODE_ACP_REQUIRE_MUSE: "1"
          MUSE_CODE_ACP_REQUIRE_HOST_FEATURES: ${{ matrix.muse.require-host-features }}

  standalone:
    name: Standalone macOS ARM64
    runs-on: macos-15
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.8.2"
          cache: "npm"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.3"
      - run: npm ci
      - run: npm run build
      - run: npm run build:standalone
      - name: Install verified external Muse host
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/muse-code"
          curl --fail --location --silent --show-error --retry 3 \
            'https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version=1.1.1-R2514.1&file=muse-aarch64-macos' \
            --output "$RUNNER_TEMP/muse-code/muse"
          echo "7dfd75e1e2dd7c763e60b7e379f4146b8b2b10478a2830c8cdbb35ae9961881e  $RUNNER_TEMP/muse-code/muse" | shasum -a 256 --check
          chmod +x "$RUNNER_TEMP/muse-code/muse"
          echo "MUSE_CODE_EXECUTABLE=$RUNNER_TEMP/muse-code/muse" >> "$GITHUB_ENV"
      - name: Standalone real-host smoke without Node on PATH
        run: npm run test:standalone -- "$PWD/artifacts/standalone/muse-code-acp-v$(node -p 'require("./package.json").version')-darwin-arm64/muse-code-acp"
